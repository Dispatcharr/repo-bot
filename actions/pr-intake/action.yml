name: 'PR Intake'
description: 'Manages intake, review assignment, and cleanup for external pull requests'
inputs:
  github-token:
    description: 'Bot installation token with Pull requests and Issues read/write permission'
    required: true
  intake-label:
    description: 'INTAKE: Label applied to eligible pull requests'
    required: false
    default: 'Triage'
  intake-comment:
    description: 'INTAKE: Comment posted on eligible pull requests'
    required: false
    default: ''
  review-label:
    description: 'REVIEW: Label added when a member has an effective changes-requested review on a triaged pull request'
    required: false
    default: 'In Review'
  closed-lookback-days:
    description: 'SCAN: Whole days of recently updated closed pull requests to inspect for cleanup'
    required: false
    default: '7'
  bypass-for-members:
    description: 'If true, skip every phase for PRs authored by collaborators, members, and owners'
    required: false
    default: 'true'
  dry-run:
    description: 'Log intended lifecycle changes without modifying pull requests'
    required: false
    default: 'false'
runs:
  using: 'node24'
  main: 'dist/index.js'
